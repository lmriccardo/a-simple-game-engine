name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docsite/**"
      - "src/ASGE/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  api-docs:
    name: Build API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Doxygen's job here is reduced to "parse C++ and emit XML" -- every
      # page is then rendered by docsite/generate_api.py using the exact
      # same nav/CSS as the rest of the site, not Doxygen's own HTML/theme.
      # That means no HTML-template version sensitivity and no Graphviz
      # dependency (diagrams are Mermaid, built from the XML's own
      # structured <inheritancegraph>/<collaborationgraph> data), so apt's
      # doxygen package is fine -- we only rely on the stable, versioned
      # XML schema, not any HTML-specific behavior.
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Determine project version
        id: version
        run: echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - name: Generate Doxygen XML
        working-directory: docsite
        run: (cat Doxyfile; echo "PROJECT_NUMBER = ${{ steps.version.outputs.version }}") | doxygen -

      - name: Render the API reference pages
        working-directory: docsite
        run: python generate_api.py

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docsite/site/api

  deploy:
    name: Assemble and deploy Pages
    needs: [api-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docsite/site/. _site/

      - uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: _site/api

      # Re-running only this job (e.g. after the transient artifact-metadata
      # propagation failures deploy-pages is prone to) re-uploads a fresh
      # "github-pages" artifact without removing the previous attempt's.
      # deploy-pages looks artifacts up by name across the whole run, so a
      # leftover duplicate makes it fail with "Multiple artifacts... found".
      - name: Remove stale github-pages artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          xargs -r -n1 -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub's artifact store is occasionally slow to make a just-uploaded
      # artifact visible to deploy-pages' own lookup, which fails with
      # "Fetching artifact metadata failed... re-run the deployment at a
      # later time" rather than retrying itself. One retry after a short
      # pause absorbs that read-after-write lag without re-running the job.
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
