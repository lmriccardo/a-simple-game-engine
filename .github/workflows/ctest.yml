name: CTest

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Build and install SDL on Linux
        if: runner.os == 'Linux'
        run: bash scripts/install-sdl-linux.sh

      - name: Build and install SDL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-sdl-windows.ps1

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 18 2026" -DBUILD_TESTING=ON -DASGE_BUILD_EXAMPLES=OFF
      
      - name: Configura on Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DASGE_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
