name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure_preset: linux-package
            build_preset: linux-package
            archive: asge-${{ github.ref_name }}-linux-x64.tar.gz
            installer_glob: build/asge-editor-*.deb
          - os: windows-latest
            configure_preset: windows-package
            build_preset: windows-package
            archive: asge-${{ github.ref_name }}-windows-x64.zip
            installer_glob: build/asge-editor-*.exe
          - os: macos-latest
            configure_preset: macos-package
            build_preset: macos-package
            archive: asge-${{ github.ref_name }}-macos-arm64.tar.gz
            installer_glob: build/asge-editor-*.dmg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Install dependencies on Linux or macOS
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: bash scripts/install-deps.sh

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-deps.ps1

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }} --config Release

      - name: Install NSIS on Windows
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Package installer (CPack)
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer_glob }}

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Archive (Linux or macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: tar -czf ${{ matrix.archive }} -C install .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path install/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate this release's notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          draft: true