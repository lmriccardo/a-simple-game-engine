name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure_preset: linux-package
            build_preset: linux-package
            archive: asge-${{ github.ref_name }}-linux-x64.tar.gz
          - os: windows-latest
            configure_preset: windows-package
            build_preset: windows-package
            archive: asge-${{ github.ref_name }}-windows-x64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: bash scripts/install-deps.sh

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-deps.ps1

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }} --config Release

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C install .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path install/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate this release's notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update full CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR with CHANGELOG.md update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md

          if git diff --staged --quiet; then
            echo "No CHANGELOG.md changes to release."
            exit 0
          fi

          branch="chore/changelog-${{ github.ref_name }}"
          git checkout -b "$branch"
          git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }}"
          git push --force origin "$branch"

          # main is ruleset-protected: push a PR branch instead of pushing to main directly,
          # then auto-merge once the ruleset's required checks/reviews clear.
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update CHANGELOG.md for ${{ github.ref_name }}" \
              --body "Automated changelog update for release ${{ github.ref_name }}."
          fi
          gh pr merge "$branch" --auto --squash

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          draft: true