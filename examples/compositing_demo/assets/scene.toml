# ASGE compositing_demo -- hand-authored scene, loaded by SceneSerializer::Load.
#
# Every entity is a plain Sprite; the compositing effects come from two fields:
#   m_Tint       color multiplied into the texture (its alpha is the opacity)
#   m_BlendMode  0 None, 1 Alpha (default), 2 Additive, 3 Modulate
# The orbs are the same sprite in two blend modes, over light-gray floor strips so
# the difference is visible (on a dark background both look alike):
#   Additive (2)  adds light to what is behind: brightens the floor, overlaps sum up
#   Alpha (1)     covers what is behind with a gold smudge, overlaps just stack
# The screen fade is not in this file: it is the ScreenFade resource, set up in Game.cpp.
#
# Roles are positional, as in scene_demo (the engine has no entity names yet);
# sprites draw in this order, so the floors come first to sit behind everything:
#   entities 0-1   floor strips
#   entities 2-7   orbs: 2 additive and 3 alpha (twins, side by side), 4 and 5 an
#                  overlapping additive pair, 6 and 7 an overlapping alpha pair
#   next 3         bouncing red hazards (have a Velocity)
#   next 3         life pips (dimmed one by one on a hit)
#   last entity    the player (WASD)
#
# Numeric Transform/Velocity fields must be TOML floats ("60.0", not "60").
# m_Tint packs the color as (alpha << 32) | (r << 16) | (g << 8) | b.

# Floor strip 0 (800x120)
[[entity]]
[entity.Transform]
m_X = 0.0
m_Y = 100.0
m_Rotation = 0.0
m_ScaleX = 50.0
m_ScaleY = 7.5

[entity.Sprite]
m_VirtualPath = "assets/block.png"
m_Tint = 1095224555660

